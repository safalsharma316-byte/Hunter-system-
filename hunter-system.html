 const lv=cfg.levels||0,to=cfg.reset?1:cfg.setLevel>0?Math.min(1000,Math.floor(cfg.setLevel)):Math.min(1000,S.lvl+lv);redeeming=true;

function grantRedeem(key){const cfg=cfgOf(key);if(!validCfg(cfg)||S.redeemed.some(r=>r.code===key))return false; // one use per profile

 else if(S.lvl>from)showLevelUp({old:from,before:r.before,gained:S.lvl-from},'CODE REDEEMED');else sys('<h3>CODE REDEEMED</h3><p class="m">+'+(cfg.xp||0)+' XP</p>');
 return true}

const godLeft=()=>BOSSES.reduce((n,b,i)=>n+(S.defeatLog.some(r=>r.idx===i)?0:1),0);
function grantGod(key,cfg){const left=BOSSES.map((b,i)=>i).filter(i=>!S.defeatLog.some(r=>r.idx===i));if(!left.length)return false;
 const from=S.lvl;let titles=0;
 for(const i of left){const b4=S.lvl;addLevels(1+Math.floor(Math.random()*10)); // random 1..10, capped at 1000
  titles+=awardBoss(i,1+Math.floor(Math.random()*10),S.lvl-b4).length;if(!S.defeated.includes(i))S.defeated.push(i)}
 S.bossIdx=BOSSES.length;S.boss=null;
 recRedeem(cfg,{code:key,levels:0,gained:S.lvl-from,xp:0,at:Date.now(),from,to:S.lvl,bosses:left.length});save();render();
 sys('<h3>'+esc(cfg.done[0])+'</h3><p class="m">'+left.length+' boss'+(left.length>1?'es':'')+' defeated · '+titles+' title'+(titles===1?'':'s')+' earned · Level '+from+' → '+S.lvl+'</p><div class="big">'+S.lvl+'</div>');return true}

{const D={done:{},daily:{},hist:[],defeated:[],defeatLog:[],titles:{},snap:{},xp:0,total:0,streak:0,best:0,last:'',reps:0,bossIdx:0,start:Date.now(),exp:'beginner',bar:true};
 for(const k in D){const v=S[k],d=D[k];if(v==null||typeof v!==typeof d||Array.isArray(v)!==Array.isArray(d))S[k]=d}} // old or partly damaged saves get safe defaults instead of crashing
